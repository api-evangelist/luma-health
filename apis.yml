aid: luma-health
url: https://raw.githubusercontent.com/api-evangelist/luma-health/refs/heads/main/apis.yml
name: Luma Health
kind: company
description: >-
  Luma Health is a United States patient-engagement (Patient Success) platform for
  healthcare provider organizations, headquartered in San Francisco, California. Its
  operational AI platform automates the patient journey - self-service scheduling and
  appointment management, referral and waitlist management, intake and digital forms,
  omnichannel two-way messaging and broadcast, appointment reminders and recalls,
  insurance eligibility verification, payments and billing, and a conversational AI
  assistant (Navigator / lumabot) - and integrates bidirectionally with the major EHRs
  (Epic, Oracle Health/Cerner, MEDITECH, eClinicalWorks, athenahealth, NextGen, Greenway,
  Nextech). Luma exposes a documented public REST API (Rest-Service v2.0.0, OpenAPI 3.0.0)
  at https://api.lumahealth.io/api/v2, secured with OAuth2 client-credentials that issue
  JWT bearer tokens. The developer-facing surface is a REST API rather than an HL7 FHIR
  server; FHIR/HL7 interoperability with EHRs happens inside Luma's integration layer, not
  as a public FHIR endpoint.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
