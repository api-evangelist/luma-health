note: >-
  Luma Health publishes NO first-party client SDK for its Rest-Service v2 API.
  The public reference at apidocs.lumahealth.io is a Redoc render of
  public.yaml and ships only x-codeSamples cURL snippets on the /auth/clients
  operations - there is no linked SDK, no generated client, and no download
  page. The lumahealthhq GitHub org (31 public repos, probed 2026-08-15) holds
  only forks of third-party Node libraries (bull, body-parser, hot-shots,
  node-schedule, passport-local, sqlstring, nightmare, dd-trace-js), hiring
  exercise repos (front-end-interview, devops-interview, sre-interview), an
  archived Redoc fork used to build the docs site (rest-service-docs), and one
  clinical-content repo (project-open-source-colonoscopy-prep). None of them is
  an API client. Integrators call the REST API directly.
