- target: $.info.description
  update: >-
    Luma Health Rest-Service v2 - the public REST surface of the Luma Patient
    Success Platform, covering scheduling and appointments, patients, providers
    and facilities, two-way messaging, broadcast and campaigns, digital intake
    and forms, billing and payments, insurance eligibility, referrals, the
    Navigator/lumabot conversational assistant, reporting and audits, and
    patient feedback and external-review management. Base URL
    https://api.lumahealth.io/api/v2. Mint machine credentials with POST
    /auth/clients, exchange them at POST /auth/token
    (grant_type=client_credentials) for a short-lived JWT, then call every other
    operation with Authorization: Bearer <JWT>. Object ids are 24-character
    lowercase hex (MongoDB ObjectId). Errors return { "message": string } with
    application/json - not RFC 9457 problem+json. No Idempotency-Key contract is
    published, so writes must be de-duplicated by the caller.
