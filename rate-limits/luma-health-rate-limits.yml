note: >-
  Luma Health documents NO rate limits for the Rest-Service v2 API. The
  published OpenAPI (278 operations) declares no 429 response on any operation
  - the full response-code census is 200 (244), 401 (270), 403 (269), 201 (39),
  404 (34), 500 (28), 400 (19), 406/409/422/204 (1 each) - and the strings
  "rate limit", "ratelimit", "throttle" (as a client contract), "Retry-After"
  and "X-RateLimit" do not occur anywhere in the document. The only "throttling"
  in the spec is a BroadcastFlow send-pacing SETTING for mass patient
  communications, not a client request budget. There is no developer portal
  beyond the Redoc render and no public help-center article on API limits
  (support.lumahealth.io serves HTTP 403 to non-browser clients), so no
  runtime backoff signal is discoverable. An integrator cannot tell from the
  public surface how many calls per second a Luma tenant may make, nor what the
  API returns when they exceed it. Limits, if any, are enforced server-side and
  communicated under contract.
