openapi: 3.2.0
info:
  version: 2.0.0
  title: Rest-Service Appointment Types API
  x-logo:
    url: https://lumahealth-assets.s3.us-west-2.amazonaws.com/new_luma_logo_black.png
    backgroundColor: '#FFFFFF'
    altText: Luma Health
  description: OpenAPI [Basic Structure](https://swagger.io/docs/specification/basic-structure/)
servers:
- url: https://api.lumahealth.io/api/v2
security:
- Bearer: []
tags:
- name: appointmentTypes
  description: EHR appointment types
paths:
  /appointmentTypes/{appointmentTypeId}:
    get:
      summary: Get an appointment type by id
      operationId: appointmentTypeGet
      tags:
      - appointmentTypes
      parameters:
      - name: appointmentTypeId
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      responses:
        '200':
          description: Type of Appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentTypeResponse'
        '401':
          description: Not authenticated
        '403':
          description: Access token does not have the required scope
    put:
      summary: Update an appointment type
      operationId: appointmentTypeUpdate
      tags:
      - appointmentTypes
      parameters:
      - name: appointmentTypeId
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      requestBody:
        description: An appointment type (full or partial) to be updated
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentTypeRequestUpdate'
      responses:
        '200':
          description: Appointment Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentTypeResponse'
        '401':
          description: Not authenticated
        '403':
          description: Access token does not have the required scope
    delete:
      summary: Delete an appointment type
      operationId: appointmentTypeDelete
      tags:
      - appointmentTypes
      parameters:
      - name: appointmentTypeId
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      responses:
        '200':
          description: Deleted appointment type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentTypeResponse'
        '401':
          description: Not authenticated
        '403':
          description: Access token does not have the required scope
  /appointmentTypes:
    get:
      summary: List appointment types
      operationId: appointmentTypesList
      tags:
      - appointmentTypes
      parameters:
      - name: _id
        in: query
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: visible
        in: query
        schema:
          type: boolean
      - name: modality
        in: query
        schema:
          type: string
          enum:
          - office-visit
          - telehealth
      - name: name
        in: query
        schema:
          type: string
      - name: description
        in: query
        schema:
          type: string
      - name: settings
        description: Path string for resources. Formatted as 'settings.{{resource}}.enabled'
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/userParam'
      - $ref: '#/components/parameters/deletedParam'
      - $ref: '#/components/parameters/createdByParam'
      - $ref: '#/components/parameters/updatedByParam'
      - $ref: '#/components/parameters/createdAtParam'
      - $ref: '#/components/parameters/updatedAtParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/populateParam'
      - $ref: '#/components/parameters/selectParam'
      responses:
        '200':
          description: List of appointment types
          content:
            application/json:
              schema:
                type: object
                required:
                - response
                - page
                - size
                properties:
                  response:
                    type: array
                    minItems: 0
                    items:
                      $ref: '#/components/schemas/AppointmentTypeResponse'
                  page:
                    type: integer
                    format: int32
                    minimum: 1
                  size:
                    type: integer
                    format: int32
                    minimum: 0
                additionalProperties: false
        '401':
          description: Not authenticated
        '403':
          description: Access token does not have the required scope
    post:
      summary: Create appointment type
      operationId: appointmentTypeCreate
      tags:
      - appointmentTypes
      requestBody:
        description: Create an appointment type
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentTypeRequestCreate'
      responses:
        '201':
          description: Successful creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentTypeResponse'
        '401':
          description: Not authenticated
        '403':
          description: Access token does not have the required scope
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
