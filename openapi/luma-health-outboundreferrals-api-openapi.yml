      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/populateParam'
      - $ref: '#/components/parameters/selectParam'
      responses:
        '200':
          description: List of outbound referrals
          content:
            application/json:
              schema:
                type: object
                required:
                - response
                - page
                - size
                properties:
                  response:
                    type: array
                    minItems: 0
                    items:
                      $ref: '#/components/schemas/OutboundReferralsResponse'
                  page:
                    type: integer
                    format: int32
                    minimum: 1
                  size:
                    type: integer
                    format: int32
                    minimum: 0
                additionalProperties: false
        '401':
          description: Not authenticated
        '403':
          description: Access token does not have the required scope
    post:
      summary: Create OutboundReferrals
      operationId: outboundReferralsCreate
      tags:
      - outboundReferrals
      requestBody:
        description: Create an outbound referral
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundReferralsCreate'
      responses:
        '201':
          description: Successful creation
          content:
            application/json:
              schema:
