          description: Deleted patientFormTemplate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientFormTemplateResponse'
        '401':
          description: Not authenticated
        '403':
          description: Access token does not have the required scope
  /patientFormTemplates/docusign/template:
    get:
      summary: Get list of DocuSign accounts availables
      operationId: listDocuSign accounts
      tags:
      - patientFormTemplates
      responses:
        '200':
          description: Returns a list of DocuSign accounts that user can switch in Luma
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    minItems: 0
                    items:
                      type: object
                      properties:
                        accountId:
                          type: string
                        isDefault:
                          type: string
                        accountName:
                          type: string
                        baseUri:
                          type: string
                additionalProperties: false
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                additionalProperties: false
        '500':
          description: An unexpected error occurred
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                additionalProperties: false
