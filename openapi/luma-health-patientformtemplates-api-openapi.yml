      parameters:
      - name: patientFormTemplateId
        in: path
        required: true
        description: PatientFormTemplates' unique identifier in Luma's database.
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      responses:
