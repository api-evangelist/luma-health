          enum:
          - patient-insurance-image
          - patient-message
          - patient-referral-fax
          - patient-referral
          - patient-form
          - provider-headshot
          - avatar
          - custom-web-style-logo
          - generic
          - integration-archive
          - patient-pdf
          - patient-ccda
          - bulk-patients-insurance
          - bulk-patients-form
          - do-not-contact-patients-list
          - archived-contacts-list
          - bulk-users-update
          - bulk-users-create
          - upload
          - lumabot-html-preview
        base64:
          type: string
          description: base64 representation of the binary file.
        patient:
          type: string
          description: ID of a Patient.
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        insurance:
          type: string
          description: ID of an Insurance.
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        referral:
          type: string
          description: ID of a Referral.
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        outboundReferral:
          type: string
          description: ID of an Outbound Referral.
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        patientForm:
          type: string
          description: ID of a Patient Form.
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        message:
          type: string
          description: ID of a Message.
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        broadcast:
          type: string
          description: ID of a Broadcast.
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        website:
          type: string
          description: Website.
        status:
          type: string
          description: Status of the file upload. Processing = File-upload was created, but still being processed, Completed = File-upload was completed successfully, Failed = File-upload has failed.
          enum:
          - processing
          - completed
          - failed
        estimate:
          type: string
          description: ID of an estimate.
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
    idParam:
      in: query
      name: _id
      type: string
      pattern: '[0-9a-f]'
      minLength: 24
      maxLength: 24
      required: false
      schema:
        type: string
        pattern: '[0-9a-f]'
        minLength: 24
        maxLength: 24
      description: Luma's internal ID of an object.
    updatedAtParam:
      in: query
      name: updatedAt
      type: string
      format: date-time
      schema:
        type: string
        format: date-time
      required: false
