openapi: 3.2.0
info:
  version: 2.0.0
  title: Rest-Service Estimates API
  x-logo:
    url: https://lumahealth-assets.s3.us-west-2.amazonaws.com/new_luma_logo_black.png
    backgroundColor: '#FFFFFF'
    altText: Luma Health
  description: OpenAPI [Basic Structure](https://swagger.io/docs/specification/basic-structure/)
servers:
- url: https://api.lumahealth.io/api/v2
security:
- Bearer: []
tags:
- name: estimates
  description: Estimates
paths:
  /estimates:
    get:
      summary: Show a list of estimate
      operationId: listEstimates
      tags:
      - estimates
      parameters:
      - name: date
        in: query
        description: The date of service.
        schema:
          type: date-time
      - name: totalPatientAmountInCents
        in: query
        description: The total amount for the patient.
        schema:
          type: number
      - name: readAt
        in: query
        description: The time that the estimate was read.
        schema:
          type: date-time
      - name: payCode
        in: query
        description: The paycode from estimate.
        schema:
          type: object
          properties:
            source:
              type: string
              enum:
              - change-healthcare
            value:
              type: string
      - name: patient
        in: query
        description: ID of a patient.
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: appointment
        in: query
        description: ID of an appointment.
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: fileUpload
        in: query
        description: ID of a file upload.
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: message
        in: query
        description: ID of a message.
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: visible
        in: query
        description: Flag that indicates if estimate is visible or not to the patient.
        schema:
          type: string
      - name: source
        in: query
        schema:
          type: string
          enum:
          - change-healthcare
      - $ref: '#/components/parameters/userParam'
      - $ref: '#/components/parameters/deletedParam'
      - $ref: '#/components/parameters/createdByParam'
      - $ref: '#/components/parameters/updatedByParam'
      - $ref: '#/components/parameters/createdAtParam'
      - $ref: '#/components/parameters/updatedAtParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/populateParam'
      - $ref: '#/components/parameters/selectParam'
      responses:
        '200':
          description: Returns a list of estimates
          content:
            application/json:
              schema:
                type: object
                required:
                - response
                - page
                - size
                properties:
                  response:
                    type: array
                    minItems: 0
                    items:
                      $ref: '#/components/schemas/EstimateResponse'
                  page:
                    type: integer
                    format: int32
                    minimum: 1
                  size:
                    type: integer
                    format: int32
                    minimum: 0
                additionalProperties: false
        '401':
          description: Not authenticated
        '403':
          description: Access token does not have the required scope
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a estimate
      operationId: estimateCreate
      tags:
      - estimates
      requestBody:
        description: Create a estimate
        required: true
        content:
          application:json:
            schema:
              $ref: '#/components/schemas/EstimateRequestCreate'
      responses:
        '201':
          description: Successful creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        '401':
          description: Not authenticated
        '403':
          description: Access token does not have the required scope
  /estimates/{estimateId}:
    get:
      summary: Get estimate by id
      operationId: estimateGet
      tags:
      - estimates
      parameters:
      - name: estimateId
        in: path
        required: true
        description: Estimate's unique identifier in Luma's database.
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      responses:
        '200':
          description: Estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        '401':
          description: Not authenticated
        '403':
          description: Access token does not have the required scope
    put:
      summary: Update a estimate
      operationId: estimateUpdate
      tags:
      - estimates
      parameters:
      - name: estimateId
        in: path
        required: true
        description: Estimate's unique identifier in Luma's database.
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      requestBody:
        description: A estimate (full or partial) to be updated
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequestUpdate'
      responses:
        '200':
          description: Estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        '401':
          description: Not authenticated
        '403':
          description: Access token does not have the required scope
    delete:
      summary: Delete a estimate
      operationId: estimateDelete
      tags:
      - estimates
      parameters:
      - name: estimateId
        in: path
        required: true
        description: Estimate's unique identifier in Luma's database.
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      responses:
        '200':
          description: Deleted estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        '401':
          description: Not authenticated
        '403':
          description: Access token does not have the required scope
