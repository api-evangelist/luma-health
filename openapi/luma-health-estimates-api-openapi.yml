        readAt:
          type: string
          format: date-time
          description: The time that the estimate was read.
        payCode:
          type: object
          description: The paycode from estimate.
          properties:
            source:
              type: string
              enum:
              - change-healthcare
            value:
              type: string
        patient:
          type: string
          description: ID of a patient.
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        appointment:
          type: string
          description: ID of an appointment.
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        fileUpload:
          type: string
          description: ID of a file upload.
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        message:
          type: string
          description: ID of a message.
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        visible:
          type: boolean
          description: Flag that indicates if estimate is visible or not to the patient.
        source:
          type: string
          enum:
          - change-healthcare
        searchIds:
          type: array
          description: Search ID index.
          items:
            type: string
            pattern: '[0-9a-f]'
            minLength: 24
            maxLength: 24
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    EstimateRequestUpdate:
