          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        facility:
          description: facility
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        appointment:
          description: appointment
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        type:
          description: appointmentType
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        date:
          description: date
          type: string
        source:
          description: source
          type: string
          enum:
          - upload
          - ui
          - integrator
        status:
          description: status
          type: string
          enum:
          - active
          - pending
          - scheduled
        attempt:
          description: attempt
          type: string
    RecallRequestCreate:
      type: object
      required:
      - patient
      - date
      properties:
        patient:
          description: patient
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        provider:
          description: provider
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        facility:
          description: facility
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        appointment:
          description: appointment
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        type:
          description: appointmentType
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        date:
          description: date
          type: string
        source:
          description: source
          type: string
          enum:
          - upload
          - ui
          - integrator
        status:
          description: status
          type: string
          enum:
          - active
          - pending
          - scheduled
        attempt:
          description: attempt
          type: string
    deletedParam:
      in: query
      name: deleted
      required: false
      type: number
      enum:
      - 0
      - 1
      schema:
        type: number
        enum:
        - 0
        - 1
      description: Flag for logical deletion where 1 means deleted.
    createdByParam:
      in: query
      name: createdBy
      type: string
      pattern: '[0-9a-f]'
      minLength: 24
      maxLength: 24
      schema:
        type: string
        pattern: '[0-9a-f]'
        minLength: 24
        maxLength: 24
      required: false
      description: The ID of the user who created this object.
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
