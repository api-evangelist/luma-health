          type: string
        previousPatientForm:
          description: 'PreviousPatientForm and nextPatientForm will be used to make it possible for forms

            to be able to jump to another form with another template so we can reduce the number of

            unecessary questions in a single form, which should help with organization and performance.

            One form must call the jump template, at which time we create a new patientForm and set

            the previous form ID on its `previousPatientForm` property.

            '
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        nextPatientForm:
          description: 'PreviousPatientForm and nextPatientForm will be used to make it possible for forms

            to be able to jump to another form with another template so we can reduce the number of

            unecessary questions in a single form, which should help with organization and performance.

            One form must call the jump template, at which time we create a new patientForm and set

            the new form ID on the first form''s `nextPatientForm` property.

            '
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
        responses:
          description: Contains information about the responses given by the patient.
          type: object
          properties:
            currentItemId:
              type: string
              description: 'The code of the current question the patient was last shown, before answering it.

                Such a code must be the content of any `responses.pages[0].questions[x].id`, or `success`.

                Usually this will contain each id, in sequence, but patients can go back and forth.

                Also, forms can have jump logic, and some questions might not be displayed to the patient.

                When the form is completed, this is updated to `success`.

                '
            path:
              description: The sequence in each questions were seen by the patient.
              type: array
              items:
                type: string
            finalDisposition:
              description: 'The last question or template answered/seen by the patient on form completion.

                Same structure as a question in `responses.pages[0].questions[i]`.

                '
              type: object
            pages:
              description: The pages of the form. Luma forms always only have one page, whose index is zero.
              type: array
              items:
                type: object
                properties:
                  questions:
                    description: 'An array of metadata about the questions and their answers. The information about the

                      questions is kept here because the template might be updated at any time, so the version

                      of these question might be out-of-date when compared to the actual patientFormTemplate.

                      '
                    type: array
                    items:
                      type: object
                      description: each item contains metadata about the question and the answer given by the patient.
                      properties:
                        id:
                          type: string
                          description: the reference code for this question, also used in `currentItemId` and `path`.
                        type:
                          type: string
                          description: 'The `PatientFormTemplateItemTypeKeys`, representing the type of question.

                            - `group`: at this root level, a special `type: group` may be used, and in that case, `responses.pages[0].questions[x].properties.items[]` will contain objects with a structure similar to one of `responses.pages[0].questions[i]` (recursively), with the exception that the inner question cannot be of type `group`.

                            - `jump`: a special type of question, containing a property called `script`in `responses.pages[0].questions[x].properties.script` which resolves to one of the values in `responses.pages[0].question[x].properties.answers[k].label`. Each `responses.pages[0].question[x].properties.answers[k].properties` will determine if the jump is to the next question (nothing inside properties), or another specific question (properties object containing a `goTo` with another question squiggly), or redirect (properties object containing a final `url` for redirection).

