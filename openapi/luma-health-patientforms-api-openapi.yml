                              description: 'Surgical History.Additional info on `reponses.pages[0].questions[i].answers`,

                                such as `reponses.pages[0].questions[i].answers[j].answer: 2022`.

                                with the same ids as the items in the history here.

                                Only used when form is CCDA.

                                '
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: UUID of the surgical history entry
                                  code:
                                    type: string
                                  codeSystem:
                                    type: string
                                    description: Luma's internal ID referring a `CCDACodeSystem` on the database.
                                  description:
                                    type: string
                                    description: Description of the surgical procedure item according to the chosen code system.
                                  friendlyName:
                                    type: string
                                    description: Friendly description of the surgical procedure item.
                            familyHistory:
                              description: 'Family History.

                                Additional info on `reponses.pages[0].questions[i].answers`,

                                such as `reponses.pages[0].questions[i].answers[j].familyMembers: [ ''Mother'' ]`.

                                with the same ids as the items in the history here.

                                Only used when form is CCDA.

                                '
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: UUID of the family history entry
                                  code:
                                    type: string
                                  codeSystem:
                                    type: string
                                    description: Luma's internal ID referring a `CCDACodeSystem` on the database.
                                  description:
                                    type: string
                                    description: Description of the family history item according to the chosen code system.
                                  friendlyName:
                                    type: string
                                    description: Friendly description of the family history item.
                            locales:
                              description: A map-object whose keys may be any of these language codes `es` or `pt`
                              type: object
                              properties:
                                es:
                                  type: object
                                  properties:
                                    description:
                                      description: the translation of the description of the question into spanish
                                      type: string
                                    title:
                                      description: the translation of the title of the question into spanish
                                      type: string
                                    properties:
                                      description: same structure as `responses.pages[0].questions[i].properties`.
                                      type: object
                                pt:
                                  type: object
                                  properties:
                                    description:
                                      description: the translation of the description of the question into portuguese
                                      type: string
                                    title:
                                      description: the translation of the title of the question into portuguese
                                      type: string
                                    properties:
                                      description: same structure as `responses.pages[0].questions[i].properties`.
                                      type: object
                            canSkip:
                              type: boolean
                            notifyStaff:
                              type: boolean
                            mappingField:
                              type: string
                              description: "The name of any Patient model fields.\nWhen this property is set, then the question will have its answer pre-populated using \nthe value from the Patient model.\nAs an example, if the mappingField for the question is `firstname`, when creating the \nform, the system will try to get this information from the patient data, and if \nthere's a value on this field, it will be set as the default answer for the question.\n"
        answers:
          description: A simplified representation of the answers contained in `responses.pages[0].questions[i]`.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: 'The id of the question to which this answer refers.

                  The content of any `responses.pages[0].questions[x].id`.

                  '
              answerId:
                type: string
                description: The id of the answer chosen or entered by the user for the given question.
              question:
                type: string
                description: the label of the question being answered by the patient.
              answer:
                type: string
                description: the answer given by the patient, either by typing of by picking an option.
              questionType:
                type: string
                description: the type of question.
