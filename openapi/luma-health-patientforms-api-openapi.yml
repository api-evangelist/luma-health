                - address
                - date
                - dropdown
                - e_signature
                - email
                - group
                - information_capture
                - insurance_card
                - jump
                - long_text
                - medication_search
                - multiple_choice
                - patient_information
                - pharmacy_search
                - phone_number
                - scheduler
                - short_text
                - ssn
                - template_welcome
                - template
                - yes_no
                - zipcode
                - copay
                - docusign_templates
                - insurance_verification
                - insurance_capture
                - medication_list
                - immunization_history
                - allergy
                - surgical_history
                - family_history
                - problems
                - social_history
                - scheduler_component
                - book_status_component
                - demographics
        path:
          description: path
          type: array
          items:
            type: string
        finalDisposition:
          description: 'Not used, and always filled with an empty string.

            Rather, see `reponses.finalDisposition`

            '
          type: string
        integratorUpdateResults:
