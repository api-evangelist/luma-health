          description: 'If the `patientFormTemplate` has a `calculation` field,

            which is a javascript code, then the result will be stored here.

            '
          type: object
        availabilities:
          description: availabilities
          type: array
          items:
            type: string
            pattern: '[0-9a-f]'
            minLength: 24
            maxLength: 24
        facilities:
          description: facilities
          type: array
          items:
            type: string
            pattern: '[0-9a-f]'
            minLength: 24
            maxLength: 24
