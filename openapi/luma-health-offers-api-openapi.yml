        in: query
        description: The ID of provider
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: duration
        in: query
        description: Duration of the offer
        schema:
          type: integer
      - name: date
        in: query
        description: Date of the offer
        schema:
          type: date-time
      - name: facility
        in: query
        description: The ID of facility
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: approvedBy
        in: query
        description: The ID of approvedBy
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: declinedBy
        in: query
        description: The ID of declinedBy
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: currentWaitlist
        in: query
        description: current Waitlist of the offer
        schema:
          type: integer
      - name: expireAt
        in: query
        description: When the offer will expire
        schema:
          type: date-time
      - name: patientFoundAt
        in: query
        description: The ID of patientFoundAt
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: patientFound
        in: query
        description: The ID of patientFound
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: estimatedCompletionAt
        in: query
        description: When the offer will be estimated complete
        schema:
          type: date-time
      - name: shadowAppointment
        in: query
        description: The ID of shadowAppointment
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: availability
        in: query
        description: The ID of availability
        schema:
          type: string
          pattern: '[0-9a-f]'
          minLength: 24
          maxLength: 24
      - name: protocol
        in: query
        description: Protocol of the offer
        schema:
          type: string
          enum:
          - serial
          - parallel
      - name: offer
        in: query
