note: >-
  Luma Health serves NO machine-readable discovery documents at /.well-known/
  on any host. Re-probed 2026-08-15 across all three hosts and every path in
  the pipeline set. The API host (api.lumahealth.io) 302-redirects EVERY path,
  including /.well-known/*, to the WordPress marketing homepage - so those
  paths answer 200 with a 220KB HTML shell after the redirect, which is a
  SOFT-200 and NOT a document. The marketing host returns real 404s. The docs
  host is an S3 bucket that answers 403 AccessDenied to anything but the two
  files Redoc loads. NO WellKnown or SecurityTxt pointer is emitted in apis.yml
  for this repo: this file records an absence, and an absence must not be
  scored as a presence. The one disclosure surface Luma does publish
  (security@lumahealth.io) is prose on a marketing page, not RFC 9116 - see
  security/luma-health-vulnerability-disclosure.yml.
